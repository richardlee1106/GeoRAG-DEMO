<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonsai Web AI</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface-2: #1e2d50;
    --primary: #4facfe;
    --primary-dim: #3a8cdb;
    --accent: #f093fb;
    --text: #e0e6ed;
    --text-dim: #8892a4;
    --border: #2a3a5c;
    --user-msg: #1e3a5f;
    --bot-msg: #1a2740;
    --success: #4ade80;
    --warning: #facc15;
    --danger: #f87171;
    --radius: 10px;
    --max-w: 800px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar: title + health ──────────────────────────── */
  .topbar {
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar .brand h1 {
    font-size: 15px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.3px;
  }
  .health-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
  }
  .health-item {
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--text-dim);
  }
  .health-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .health-dot.ok { background: var(--success); box-shadow: 0 0 4px var(--success); }
  .health-dot.err { background: var(--danger); }
  .health-dot.unk { background: #444; }

  /* ── Status bar (pipeline progress) ──────────────────── */
  .status-bar {
    padding: 6px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 30px;
    flex-shrink: 0;
    font-size: 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .status-bar .pipe {
    color: var(--border);
    margin: 0 4px;
    font-size: 10px;
  }
  .st-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    transition: color 0.3s;
  }
  .st-item.active { color: var(--text); }
  .st-item.done { color: var(--success); }
  .st-spin {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .st-detail {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  /* ── Controls bar ──────────────────────────────────────── */
  .controls {
    padding: 6px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    color: var(--text-dim);
    transition: color 0.2s;
  }
  .controls label:hover { color: var(--text); }
  .controls input[type="checkbox"] {
    appearance: none;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .controls input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
  }
  .controls input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    top: -2px; left: 2px;
    color: white;
    font-size: 12px;
    font-weight: bold;
  }
  .controls .right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* ── Chat area ────────────────────────────────────────── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: var(--max-w);
    margin: 0 auto 14px;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    margin-top: 2px;
  }
  .msg.user .msg-avatar { background: var(--primary); color: #fff; }
  .msg.assistant .msg-avatar { background: var(--accent); color: #fff; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--user-msg);
    border: 1px solid var(--surface-2);
  }
  .msg.assistant .msg-bubble {
    background: var(--bot-msg);
    border: 1px solid var(--border);
  }
  .msg-bubble p { margin-bottom: 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { color: var(--primary); }
  .msg-bubble code {
    background: var(--surface-2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .msg-bubble pre {
    background: var(--surface-2);
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 6px 0;
    font-size: 12px;
  }
  .msg-bubble a { color: var(--primary); }
  .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }

  /* ── Typing indicator ──────────────────────────────────── */
  .typing {
    max-width: var(--max-w);
    margin: 0 auto 14px;
    padding-left: 38px;
  }
  .typing-dots { display: flex; gap: 3px; padding: 10px 14px; }
  .typing-dots span {
    width: 7px; height: 7px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  /* ── Input area ────────────────────────────────────────── */
  .input-area {
    padding: 12px 20px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-wrap {
    max-width: var(--max-w);
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .input-wrap textarea {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 40px;
    max-height: 160px;
  }
  .input-wrap textarea:focus { border-color: var(--primary); }
  .input-wrap textarea::placeholder { color: var(--text-dim); font-size: 13px; }
  .input-wrap button {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    background: var(--primary);
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .input-wrap button:hover { background: var(--primary-dim); }
  .input-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-wrap button .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }

  /* ── Welcome ───────────────────────────────────────────── */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .welcome h2 { font-size: 22px; margin-bottom: 8px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .welcome p { font-size: 13px; line-height: 1.7; }
  .welcome .features { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .welcome .features span { padding: 4px 10px; border-radius: 14px; background: var(--surface-2); font-size: 11px; color: var(--text-dim); }

  .msg-bubble.error { border-color: var(--danger) !important; }

  /* ── Error bubble ──────────────────────────────────────── */
  .err-msg {
    max-width: var(--max-w);
    margin: 0 auto 14px;
    padding-left: 38px;
  }
  .err-msg .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    background: rgba(248,113,113,0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
  }

  @media (max-width: 600px) {
    .topbar { padding: 8px 12px; }
    .status-bar { padding: 4px 12px; font-size: 11px; }
    .controls { padding: 4px 12px; flex-wrap: wrap; }
    .chat-area { padding: 10px 12px; }
    .input-area { padding: 8px 12px 12px; }
    .health-item .label { display: none; }
  }

  /* ── Breathing animations ──────────────────────────── */
  @keyframes breathe-glow {
      0%, 100% { box-shadow: 0 0 4px rgba(79,172,254,0.03), 0 0 8px rgba(240,147,251,0.03); }
      50% { box-shadow: 0 0 10px rgba(79,172,254,0.12), 0 0 20px rgba(240,147,251,0.07); }
  }
  @keyframes breathe-avatar {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.06); filter: brightness(1.12); }
  }
  @keyframes breathe-gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
  }
  @keyframes float-tag {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
  }
  @keyframes breathe-send {
      0%, 100% { box-shadow: 0 0 0 rgba(79,172,254,0); }
      50% { box-shadow: 0 0 8px rgba(79,172,254,0.2); }
  }

  /* Apply breathing glow to assistant bubbles */
  .msg.assistant .msg-bubble {
      animation: breathe-glow 4s ease-in-out infinite;
  }
  /* Apply breathing pulse to assistant avatar */
  .msg.assistant .msg-avatar {
      animation: breathe-avatar 3s ease-in-out infinite;
  }
  /* Animate brand gradient */
  .topbar .brand h1 {
      background-size: 200% 200%;
      animation: breathe-gradient 5s ease infinite;
  }
  /* Breathing float on welcome feature tags */
  .welcome .features span {
      animation: float-tag 3s ease-in-out infinite;
  }
  .welcome .features span:nth-child(2) { animation-delay: 0.4s; }
  .welcome .features span:nth-child(3) { animation-delay: 0.8s; }
  .welcome .features span:nth-child(4) { animation-delay: 1.2s; }
  .welcome .features span:nth-child(5) { animation-delay: 1.6s; }
  /* Breathing pulse on send button hover */
  .input-wrap button:not(:disabled):hover {
      animation: breathe-send 1.5s ease-in-out infinite;
  }

  /* ── Message sources (webpage titles at bubble end) ── */
  .msg-sources {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(79, 172, 254, 0.04);
      border: 1px solid rgba(79, 172, 254, 0.1);
      animation: fadeIn 0.3s ease;
  }
  .sources-header {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 5px;
      font-weight: 500;
      letter-spacing: 0.3px;
  }
  .source-item {
      display: block;
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      padding: 4px 8px;
      margin-bottom: 2px;
      border-radius: 4px;
      background: transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
  }
  .source-item::before {
      content: '🔗 ';
      opacity: 0.6;
  }
  .source-item:hover {
      background: rgba(79, 172, 254, 0.12);
      padding-left: 12px;
  }
  .source-item:last-child {
      margin-bottom: 0;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand">
    <span style="font-size:18px;">🪴</span>
    <h1>Bonsai Web AI</h1>
  </div>
  <div class="health-group" id="healthBar">
    <span class="health-item"><span class="health-dot unk" id="hlm"></span><span class="label">LLM</span></span>
    <span class="health-item"><span class="health-dot unk" id="hemb"></span><span class="label">Emb</span></span>
    <span class="health-item"><span class="health-dot unk" id="hrerank"></span><span class="label">Rerank</span></span>
    <span class="health-item"><span class="health-dot unk" id="hsearch"></span><span class="label">Search</span></span>
  </div>
</div>

<!-- Pipeline status bar -->
<div class="status-bar" id="statusBar">
  <span class="st-item" id="st_idle">💡 等待输入...</span>
  <span class="st-item" id="st_searching" style="display:none;"><span class="st-spin"></span>🔍 SearXNG 搜索</span>
  <span class="st-item" id="st_extracting" style="display:none;"><span class="st-spin"></span>📄 save-your-token 提取</span>
  <span class="st-item" id="st_building_ctx" style="display:none;"><span class="st-spin"></span>📋 整理上下文</span>
  <span class="st-item" id="st_generating" style="display:none;"><span class="st-spin"></span>💬 Bonsai-8B 生成</span>
  <span class="st-detail" id="st_detail"></span>
</div>

<!-- Controls -->
<div class="controls">
  <label><input type="checkbox" id="webSearchToggle"><span>🌐 联网搜索</span></label>
  <div class="right">
    <label style="font-size:12px;color:var(--text-dim);">
      <input type="checkbox" id="autoScrollToggle" checked> 自动滚动
    </label>
  </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <h2>🪴 Bonsai</h2>
    <p>本地 AI 助手 · 支持联网搜索与 RAG</p>
    <div class="features">
      <span>🧠 Bonsai-8B</span>
      <span>🔤 Jina Embedding v5</span>
      <span>📊 BGE Reranker v2</span>
      <span>🔍 SearXNG</span>
      <span>📄 save-your-token</span>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="inputBox" rows="1" placeholder="输入问题，Enter 发送" enterkeyhint="send"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
console.log('%c🪴 Bonsai Web AI', 'font-size:20px; font-weight:bold; color:#4facfe');

// ─── DOM refs ──────────────────────────────────────────────
const chatArea = document.getElementById('chatArea');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const webSearchToggle = document.getElementById('webSearchToggle');
const autoScrollToggle = document.getElementById('autoScrollToggle');
const welcome = document.getElementById('welcome');

const st = {};
['idle','searching','extracting','building_ctx','generating'].forEach(k => st[k] = document.getElementById('st_' + k));
st.detail = document.getElementById('st_detail');

const hDots = { llm: 'hlm', emb: 'hemb', rerank: 'hrerank', search: 'hsearch' };

// ─── Textarea auto-resize ──────────────────────────────────
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
});
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

function scrollToBottom() {
  if (autoScrollToggle.checked) chatArea.scrollTop = chatArea.scrollHeight;
}

// ─── Status helpers ────────────────────────────────────────
function showStage(stage) {
  Object.values(st).forEach(el => { if (el) el.style.display = 'none'; });
  st.detail.style.display = 'none';
  if (stage === 'idle') { st.idle.style.display = 'inline-flex'; return; }
  if (st[stage]) { st[stage].style.display = 'inline-flex'; st[stage].className = 'st-item active'; }
}
function setStatusDetail(text) { st.detail.textContent = text; st.detail.style.display = 'inline'; }
function clearStatus() { showStage('idle'); st.detail.style.display = 'none'; }

// ─── Console logger ─────────────────────────────────────────
const LOG_COLORS = {
  searching:'color:#4facfe', extracting:'color:#f093fb', embedding:'color:#4ade80',
  reranking:'color:#facc15', building_ctx:'color:#8892a4', generating:'color:#f87171',
  done:'color:#4ade80', error:'color:#f87171;font-weight:bold'
};
function logStage(stage, msg, detail) {
  const ts = new Date().toLocaleTimeString();
  console.log(`%c[${ts}][${stage}] ${msg}`, LOG_COLORS[stage]||'color:#8892a4', detail||'');
}

// ─── Markdown (lightweight) ────────────────────────────────
function renderMarkdown(t) {
  let h = t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/^### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^# (.+)$/gm,'<h2>$1</h2>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
  h = h.replace(/((?:<li>.*?<\/li><br>?)+)/g,'<ul>$1</ul>');
  h = h.replace(/<p><\/p>/g,'');
  return '<p>' + h + '</p>';
}

// ─── Message DOM ───────────────────────────────────────────
function addMessage(role, content) {
  welcome?.remove();
  const d = document.createElement('div'); d.className = `msg ${role}`;
  const a = document.createElement('div'); a.className = 'msg-avatar'; a.textContent = role === 'user' ? '你' : 'AI';
  const b = document.createElement('div'); b.className = 'msg-bubble'; b.innerHTML = renderMarkdown(content);
  d.appendChild(a); d.appendChild(b);
  chatArea.appendChild(d); scrollToBottom();
  return b;
}
function updateMessage(bubble, content) { bubble.innerHTML = renderMarkdown(content); }

function appendSources(bubble, sources) {
  const existing = bubble.parentNode.querySelector('.msg-sources');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'msg-sources';
  let html = '<div class="sources-header">📚 参考来源</div>';
  sources.forEach(s => {
    const title = escapeHtml(s.title);
    const url = escapeHtml(s.url);
    html += `<a class="source-item" href="${url}" target="_blank" rel="noopener">${title}</a>`;
  });
  div.innerHTML = html;
  bubble.after(div);
  scrollToBottom();
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showTyping() {
  welcome?.remove();
  const el = document.getElementById('typingIndicator'); if (el) el.remove();
  const d = document.createElement('div'); d.className = 'typing'; d.id = 'typingIndicator';
  d.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  chatArea.appendChild(d); scrollToBottom();
}
function removeTyping() { document.getElementById('typingIndicator')?.remove(); }

// ─── Send message ──────────────────────────────────────────
let isStreaming = false;

async function sendMessage() {
  const message = inputBox.value.trim();
  if (!message || isStreaming) return;

  inputBox.value = ''; inputBox.style.height = 'auto';
  addMessage('user', message);
  showTyping();
  showStage('searching');

  isStreaming = true;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span>';

  const webSearch = webSearchToggle.checked;
  let messageSources = null; // holds webpage sources from backend
  console.group(`%c📨 "${message.slice(0,50)}${message.length>50?'...':''}"`,'font-weight:bold');
  console.log(`联网: ${webSearch ? '✅' : '❌'}`);

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, web_search: webSearch, history: [] }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    removeTyping();
    const bubble = addMessage('assistant', '');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    // Typewriter streaming: render each token immediately
    let fullContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const parsed = JSON.parse(data);
          switch (parsed.type) {
            case 'status':
              handleStatusEvent(parsed);
              break;
            case 'sources':
              messageSources = parsed.sources;
              logStage('sources', `获取 ${parsed.sources.length} 个网页来源`);
              break;
            case 'token':
              fullContent += parsed.content;
              updateMessage(bubble, fullContent);
              scrollToBottom();
              break;
            case 'done':
              fullContent = parsed.content;
              updateMessage(bubble, fullContent);
              if (messageSources && messageSources.length > 0) {
                appendSources(bubble, messageSources);
              }
              logStage('done', '回答完成', `${fullContent.length} chars`);
              break;
          }
        } catch(e) {}
      }
    }
    console.groupEnd();

  } catch (err) {
    console.groupEnd();
    removeTyping();
    const el = document.createElement('div'); el.className = 'err-msg';
    el.innerHTML = `<div class="bubble">${err.name === 'AbortError' ? '已取消' : '请求失败: ' + err.message}</div>`;
    chatArea.appendChild(el); scrollToBottom();
    logStage('error', err.name === 'AbortError' ? '已取消' : err.message);
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
    clearStatus();
  }
}

// ─── Status event handler ──────────────────────────────────
function handleStatusEvent(p) {
  const { stage, message, detail } = p;
  if (['searching','extracting','building_ctx','generating'].includes(stage)) {
    showStage(stage);
  } else if (stage === 'done_no_context') {
    showStage('generating');
  }
  if (detail) setStatusDetail(detail);
  logStage(stage, message, detail);
}

// ─── Health check ──────────────────────────────────────────
async function checkHealth() {
  try {
    const resp = await fetch('/api/health');
    const data = await resp.json();
    const map = { llm: 'hlm', embedding: 'hemb', reranker: 'hrerank', searxng: 'hsearch' };
    for (const [k, id] of Object.entries(map)) {
      const v = data[k];
      document.getElementById(id).className = 'health-dot ' + (v === 'ok' ? 'ok' : 'err');
    }
  } catch {
    Object.values(hDots).forEach(id => document.getElementById(id).className = 'health-dot err');
  }
}
checkHealth();
setInterval(checkHealth, 60000);
</script>
